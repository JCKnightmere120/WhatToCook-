<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/tabs/more"></ion-back-button></ion-buttons><ion-title>Favorites</ion-title></ion-toolbar></ion-header>
<ion-content><div class="page"><ion-spinner *ngIf="loading"></ion-spinner><p *ngIf="message">{{ message }}</p><ion-card *ngFor="let recipe of recipes"><img [src]="image(recipe)" [alt]="recipe.name" (error)="fallback($event)"><ion-card-header><ion-card-title>{{ recipe.name }}</ion-card-title><ion-card-subtitle>{{ recipe.servings || 2 }} servings · {{ (recipe.prep_time || 0) + (recipe.cook_time || 0) }} min</ion-card-subtitle></ion-card-header><ion-card-content><p>{{ recipe.description }}</p><ion-button fill="outline" (click)="open(recipe)">View recipe</ion-button><ion-button fill="clear" color="danger" (click)="remove(recipe)">Remove</ion-button></ion-card-content></ion-card><section class="empty" *ngIf="!loading && !recipes.length"><ion-icon name="heart-outline"></ion-icon><h2>No saved recipes</h2><p>Save recipes from Discover to find them here.</p></section></div></ion-content>
