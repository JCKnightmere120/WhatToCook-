<ion-content class="auth-content"><main class="auth-shell">
  <section class="brand"><div class="brand-mark"><ion-icon name="restaurant"></ion-icon></div><p>WhatToCook?</p><h1>Meals that work for your whole family.</h1><span>Plan around what you have, who is eating, and what matters to them.</span></section>
  <section class="auth-card"><div class="mode-toggle"><button [class.active]="mode === 'login'" (click)="mode = 'login'; error = ''">Sign in</button><button [class.active]="mode === 'register'" (click)="mode = 'register'; error = ''">Create account</button></div>
    <form (ngSubmit)="submit()"><ion-input *ngIf="mode === 'register'" [(ngModel)]="name" name="name" label="Your name" labelPlacement="stacked" autocomplete="name" required></ion-input><ion-input [(ngModel)]="email" name="email" label="Email address" labelPlacement="stacked" type="email" autocomplete="email" required></ion-input><ion-input [(ngModel)]="password" name="password" label="Password" labelPlacement="stacked" type="password" autocomplete="current-password" required></ion-input><ion-input *ngIf="mode === 'register'" [(ngModel)]="passwordConfirmation" name="passwordConfirmation" label="Confirm password" labelPlacement="stacked" type="password" autocomplete="new-password" required></ion-input><p class="error" *ngIf="error">{{ error }}</p><ion-button expand="block" type="submit" [disabled]="submitting">{{ submitting ? 'Please wait…' : (mode === 'login' ? 'Sign in' : 'Create account') }}</ion-button></form>
  </section>
</main></ion-content>
