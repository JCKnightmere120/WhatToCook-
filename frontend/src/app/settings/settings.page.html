<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/tabs/more"></ion-back-button></ion-buttons><ion-title>Settings</ion-title></ion-toolbar></ion-header>
<ion-content><div class="page"><h1>Appearance</h1><ion-list inset="true"><ion-item><ion-icon name="moon-outline" slot="start"></ion-icon><ion-label><h2>Dark mode</h2><p>Use a darker appearance in low light.</p></ion-label><ion-toggle [checked]="theme.dark" (ionChange)="theme.setDark($any($event.detail.checked))"></ion-toggle></ion-item></ion-list><h1>Notifications</h1><ion-list inset="true"><ion-item><ion-icon name="notifications-outline" slot="start"></ion-icon><ion-label><h2>Pantry reminders</h2><p>Expiry and freshness-review notifications will be configured here.</p></ion-label></ion-item></ion-list></div></ion-content>
