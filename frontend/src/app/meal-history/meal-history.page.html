<ion-header><ion-toolbar><ion-title>Meal history</ion-title></ion-toolbar></ion-header><ion-content><main class="page"><p *ngIf="household">Meals cooked for {{household.name}}</p><p class="message" *ngIf="message">{{message}}</p><ion-spinner *ngIf="loading"></ion-spinner><ion-list *ngIf="!loading"><ion-item *ngFor="let item of items"><ion-icon name="restaurant-outline" slot="start"></ion-icon><ion-label><h2>{{recipeName(item)}}</h2><p>{{item.prepared_at | date:'mediumDate'}} · {{item.servings || 1}} servings</p><p *ngIf="item.notes">{{item.notes}}</p></ion-label></ion-item></ion-list><p *ngIf="!loading && !items.length">Cook a scheduled meal to start your history.</p></main></ion-content>
