name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whattocook-backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # composer.lock includes Symfony 8 packages, which require PHP 8.4.1+.
          php-version: '8.4'
          extensions: sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: php artisan test

  ionic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Build-only value; it is not a deploy target or a credential.
      WHATTOCOOK_API_BASE_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:android
      - run: npm run test:ci
